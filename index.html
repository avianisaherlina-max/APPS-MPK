<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <!-- Link Manifest untuk PWA -->
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    /* Header */
    .chat-header {
      background-color: #075e54;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .title {
      font-size: 18px;
      font-weight: bold;
    }
    /* Area Pesan */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.received {
      background: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 0;
    }
    .message.sent {
      background: #dcf8c6;
      align-self: flex-end;
      border-top-right-radius: 0;
    }
    /* Input Area */
    .chat-input-area {
      background: #f0f0f0;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .file-input {
      display: none;
    }
    .btn-attach {
      cursor: pointer;
      font-size: 20px;
      padding: 4px 8px;
    }
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    .btn-send {
      background: #128c7e;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Header Aplikasi -->
  <div class="chat-header">
    <div class="title">Chat Room</div>
  </div>

  <!-- Area Daftar Pesan -->
  <div class="chat-messages" id="messageList">
    <div class="message received">Halo! Selamat datang di aplikasi chat.</div>
  </div>

  <!-- Form Pengiriman Pesan dan File -->
  <div class="chat-input-area">
    <label for="fileAttachment" class="btn-attach">📎</label>
    <input type="file" id="fileAttachment" class="file-input" accept="image/*,.pdf,.doc,.docx">
    
    <input type="text" id="messageInput" class="chat-input" placeholder="Ketik pesan...">
    <button class="btn-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  function sendMessage() {
    const input = document.getElementById('messageInput');
    const messageText = input.value.trim();
    
    if (messageText !== '') {
      const messageList = document.getElementById('messageList');
      const newMessage = document.createElement('div');
      newMessage.className = 'message sent';
      newMessage.textContent = messageText;
      
      messageList.appendChild(newMessage);
      input.value = '';
      messageList.scrollTop = messageList.scrollHeight;
    }
  }
</script>

</body>
</html>
